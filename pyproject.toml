[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "bitforge"
version = "0.1.0"
description = "Q15 integer arithmetic primitives with a float-operation source audit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15", "mypy>=1.20,<2", "build>=1.4,<2"]
viz = ["matplotlib>=3.10,<4"]

[tool.hatch.build.targets.wheel]
packages = ["bitforge"]

[tool.ruff]
line-length = 100
